<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang='en' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>

<head>

  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0' name='viewport'/>

  <title>Offer</title>

</head>

<body>

  <script type='text/javascript'>
  //<![CDATA[

  const API_KEY = "47151|u5qhW6tWVoLeabJ35geBCd9CRO6urZEewrYpvyFe31134733";
  const API_URL = "https://appsave.store/api/v2";
  const OFFER_ID = 74662;

  async function loadOffer() {

      try {

          /*
           * Get visitor IPv4 from ipify
           */
          const ipResponse = await fetch(
              "https://api4.ipify.org?format=json"
          );

          if (!ipResponse.ok) {
              throw new Error("Could not get IPv4");
          }

          const ipData = await ipResponse.json();
          const visitorIP = ipData.ip;

          console.log("Visitor IPv4:", visitorIP);

          /*
           * Prepare Offer API request
           */
          const params = new URLSearchParams();

          params.set("ip", visitorIP);
          params.set("user_agent", navigator.userAgent);

          const response = await fetch(
              API_URL + "?" + params.toString(),
              {
                  method: "GET",
                  headers: {
                      "Authorization": "Bearer " + API_KEY
                  }
              }
          );

          if (!response.ok) {
              throw new Error(
                  "Offer API HTTP error: " + response.status
              );
          }

          const data = await response.json();

          console.log("Offer API:", data);

          if (!data.success) {
              throw new Error(
                  data.error || "Offer API returned an error"
              );
          }

          if (!Array.isArray(data.offers)) {
              throw new Error("No offers returned");
          }

          /*
           * Find offer 74662
           */
          const offer = data.offers.find(function(item) {
              return Number(item.offerid) === OFFER_ID;
          });

          if (!offer) {
              throw new Error(
                  "Offer " + OFFER_ID + " not found"
              );
          }

          if (!offer.link) {
              throw new Error(
                  "Offer link is empty"
              );
          }

          /*
           * Direct redirect to offer
           */
          window.location.replace(offer.link);

      } catch (error) {

          console.error("Offer Error:", error);

          document.body.innerHTML =
              "<div style='text-align:center;margin-top:50px;font-family:Arial'>" +
              "<h3>Offer is not available.</h3>" +
              "</div>";

      }

  }

  loadOffer();

  //]]>
  </script>

</body>

</html>
