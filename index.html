<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        .header {
            background: #171b25;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .game-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 30px auto;
            padding: 15px;
        }

        .game-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid #303746;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-screen {
            text-align: center;
        }

        .start-screen h2 {
            margin-bottom: 20px;
        }

        .play-btn {
            border: 0;
            padding: 14px 30px;
            border-radius: 8px;
            background: #00c853;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .play-btn:hover {
            background: #00a844;
        }

        #game {
            display: none;
            width: 100%;
            height: 100%;
        }

        .info {
            margin-top: 20px;
            padding: 20px;
            background: #171b25;
            border-radius: 10px;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎮 My Game</h1>
    </div>

    <div class="game-wrapper">

        <div class="game-box">

            <div class="start-screen" id="startScreen">
                <h2>Ready to Play?</h2>
                <button class="play-btn" onclick="startGame()">
                    ▶ Play Game
                </button>
            </div>

            <canvas id="game"></canvas>

        </div>

        <div class="info">
            <h2>Game Instructions</h2>
            <p>Click the Play button to start the game.</p>
        </div>

    </div>

    <footer>
        © 2026 My Game
    </footer>


    <!-- =========================================

    <!-- =========================================
         SIMPLE DEMO GAME
         Replace this with your own game code
         ========================================= -->

    <script>

        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");

        var player = {
            x: 100,
            y: 100,
            size: 30,
            speed: 5
        };

        var keys = {};

        document.addEventListener("keydown", function(e) {
            keys[e.key] = true;
        });

        document.addEventListener("keyup", function(e) {
            keys[e.key] = false;
        });

        function startGame() {

            document.getElementById("startScreen").style.display = "none";

            canvas.style.display = "block";

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            gameLoop();
        }

        function update() {

            if (keys["ArrowUp"] || keys["w"]) {
                player.y -= player.speed;
            }

            if (keys["ArrowDown"] || keys["s"]) {
                player.y += player.speed;
            }

            if (keys["ArrowLeft"] || keys["a"]) {
                player.x -= player.speed;
            }

            if (keys["ArrowRight"] || keys["d"]) {
                player.x += player.speed;
            }

            player.x = Math.max(
                0,
                Math.min(canvas.width - player.size, player.x)
            );

            player.y = Math.max(
                0,
                Math.min(canvas.height - player.size, player.y)
            );
        }

        function draw() {

            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00c853";

            ctx.fillRect(
                player.x,
                player.y,
                player.size,
                player.size
            );

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px Arial";

            ctx.fillText(
                "Use Arrow Keys or WASD",
                15,
                25
            );
        }

        function gameLoop() {

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

    </script>

</body>
</html>
