<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0d1117;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #161b22;
        }

        .game-container {
            width: 100%;
            max-width: 1000px;
            margin: 25px auto;
            padding: 15px;
        }

        .game-box {
            width: 100%;
            min-height: 500px;
            background: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-button {
            padding: 15px 35px;
            border: 0;
            border-radius: 8px;
            background: #238636;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .play-button:hover {
            background: #2ea043;
        }
    </style>
</head>

<body>

<!-- POPCASH: LOAD IMMEDIATELY -->
<script type="text/javascript">
    var uid = '278189';
    var wid = '572399';
    var pop_fback = 'up';

    var pop_tag = document.createElement('script');
    pop_tag.type = 'text/javascript';
    pop_tag.src = 'https://cdn.popcash.net/show.js';

        fallback.type = 'text/javascript';

        document.body.appendChild(fallback);
    };

<header class="header">
    <h1>🎮 My Game</h1>
</header>

<div class="game-container">

    <div class="game-box" id="gameBox">

        <div id="startScreen">
            <h2>Ready?</h2>

            <button class="play-button" onclick="startGame()">
                ▶ PLAY GAME
            </button>
        </div>

        <canvas id="gameCanvas" style="display:none;"></canvas>

    </div>

</div>

<script>
    function startGame() {

        var screen = document.getElementById("startScreen");
        var canvas = document.getElementById("gameCanvas");

        screen.style.display = "none";
        canvas.style.display = "block";

        canvas.width = document.getElementById("gameBox").clientWidth;
        canvas.height = 500;

        var ctx = canvas.getContext("2d");

        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff66";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "GAME STARTED!",
            canvas.width / 2,
            canvas.height / 2
        );
    }
</script>

</body>
</html>
